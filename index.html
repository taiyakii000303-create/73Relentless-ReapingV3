<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 7.3 連なる青き魂 轉盤計算器</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent-color: #27272a;
            --text-color: #e4e4e7;
            --inner-color: #38bdf8;
            --outer-color: #fb923c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #22d3ee;
            text-shadow: 0 0 8px rgba(34,211,238,0.2);
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: bold;
            border-left: 4px solid #22d3ee;
            padding-left: 8px;
        }

        .orig-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .orig-box {
            background: #27272a;
            padding: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid #3f3f46;
            transition: all 0.2s;
        }

        .orig-box.inner { background: #0c4a6e; color: var(--inner-color); border-color: var(--inner-color); }
        .orig-box.outer { background: #7c2d12; color: var(--outer-color); border-color: var(--outer-color); }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-btn {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .input-btn.btn-inner { background-color: #0284c7; }
        .input-btn.btn-outer { background-color: #ea580c; }
        
        .input-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .reset-btn {
            grid-column: span 2;
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: bold;
        }

        .shift-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shift-btn {
            background-color: #27272a;
            color: #fff;
            border: 2px solid #3f3f46;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .shift-btn span.big-num {
            font-size: 2rem;
            font-weight: 900;
            color: #a1a1aa;
            margin-right: 12px;
            vertical-align: middle;
        }

        .shift-btn.active {
            background-color: #15803d;
            border-color: #4ade80;
        }
        .shift-btn.active span.big-num {
            color: #fff;
        }

        .result-box {
            background: #09090b;
            border-radius: 12px;
            padding: 15px;
            border: 2px solid #22d3ee;
            box-shadow: 0 0 15px rgba(34,211,238,0.1);
        }

        .result-title {
            text-align: center;
            font-weight: bold;
            color: #22d3ee;
            margin-bottom: 15px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
        }

        .step-card {
            background: #18181b;
            padding: 12px 5px;
            border-radius: 8px;
            border: 1px solid #27272a;
        }

        .step-card.res-inner { border-color: var(--inner-color); background: #072e44; }
        .step-card.res-outer { border-color: var(--outer-color); background: #4a1d1d; }

        .step-num {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 5px;
            line-height: 1;
            color: #52525b;
        }
        .step-card.res-inner .step-num { color: var(--inner-color); }
        .step-card.res-outer .step-num { color: var(--outer-color); }

        .step-val {
            font-size: 1.4rem;
            font-weight: bold;
            color: #a1a1aa;
        }
        .step-card.res-inner .step-val { color: #fff; }
        .step-card.res-outer .step-val { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>連なる青き魂 計算器</h1>

    <!-- 1. 輸入原本機制 -->
    <div class="section">
        <div class="section-title">1. 原本預兆順序 (點滿2次自動補齊)</div>
        <div class="orig-display">
            <div class="orig-box" id="orig-1">-</div>
            <div class="orig-box" id="orig-2">-</div>
            <div class="orig-box" id="orig-3">-</div>
            <div class="orig-box" id="orig-4">-</div>
        </div>
        <div class="input-group">
            <button class="input-btn btn-inner" id="btn-in" onclick="inputAction('內')">內 進</button>
            <button class="input-btn btn-outer" id="btn-out" onclick="inputAction('外')">外 遠</button>
            <button class="reset-btn" onclick="resetAll()">重製清除</button>
        </div>
    </div>

    <!-- 2. 選擇轉盤起點 -->
    <div class="section">
        <div class="section-title">2. 魂の輪轉 (看起點特大數字)</div>
        <div class="shift-group">
            <button class="shift-btn" id="s-2" onclick="setShift(2)"><span class="big-num">2</span> 3 4 1</button>
            <button class="shift-btn" id="s-3" onclick="setShift(3)"><span class="big-num">3</span> 4 1 2</button>
            <button class="shift-btn" id="s-4" onclick="setShift(4)"><span class="big-num">4</span> 1 2 3</button>
        </div>
    </div>

    <!-- 最終迴避順序 -->
    <div class="result-box">
        <div class="result-title">★ 最終迴避順序 (大數字為對應原招式) ★</div>
        <div class="steps">
            <div class="step-card" id="card-1">
                <div class="step-num" id="num-1">-</div>
                <div class="step-val" id="val-1">-</div>
            </div>
            <div class="step-card" id="card-2">
                <div class="step-num" id="num-2">-</div>
                <div class="step-val" id="val-2">-</div>
            </div>
            <div class="step-card" id="card-3">
                <div class="step-num" id="num-3">-</div>
                <div class="step-val" id="val-3">-</div>
            </div>
            <div class="step-card" id="card-4">
                <div class="step-num" id="num-4">-</div>
                <div class="step-val" id="val-4">-</div>
            </div>
        </div>
    </div>
</div>

<script>
    let seq = []; 
    let chosenShift = null; 

    function inputAction(type) {
        if (seq.length >= 4) return;

        let countIn = seq.filter(x => x === '內').length;
        let countOut = seq.filter(x => x === '外').length;

        if (type === '內' && countIn >= 2) return;
        if (type === '外' && countOut >= 2) return;

        seq.push(type);

        countIn = seq.filter(x => x === '內').length;
        countOut = seq.filter(x => x === '外').length;

        if (countIn === 2 && seq.length < 4) {
            while (seq.length < 4) seq.push('外');
        } else if (countOut === 2 && seq.length < 4) {
            while (seq.length < 4) seq.push('內');
        }

        updateOrigDisplay();

        if (seq.length === 4) {
            document.getElementById('btn-in').disabled = true;
            document.getElementById('btn-out').disabled = true;
        }

        calculateResult();
    }

    function updateOrigDisplay() {
        for (let i = 0; i < 4; i++) {
            const box = document.getElementById(`orig-${i+1}`);
            if (seq[i]) {
                box.innerText = seq[i];
                box.className = 'orig-box ' + (seq[i] === '內' ? 'inner' : 'outer');
            } else {
                box.innerText = '-';
                box.className = 'orig-box';
            }
        }
    }

    function setShift(num) {
        chosenShift = num;
        
        const nums = [2, 3, 4];
        nums.forEach(n => {
            const btn = document.getElementById(`s-${n}`);
            if (n === num) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        calculateResult();
    }

    function calculateResult() {
        if (seq.length < 4 || !chosenShift) return;

        let order = [];
        if (chosenShift === 2) order = [2, 3, 4, 1];
        if (chosenShift === 3) order = [3, 4, 1, 2];
        if (chosenShift === 4) order = [4, 1, 2, 3];

        for (let i = 0; i < 4; i++) {
            const origNum = order[i]; 
            const action = seq[origNum - 1]; 

            const card = document.getElementById(`card-${i+1}`);
            const numText = document.getElementById(`num-${i+1}`);
            const valText = document.getElementById(`val-${i+1}`);

            numText.innerText = origNum;
            valText.innerText = action;

            if (action === '內') {
                card.className = 'step-card res-inner';
            } else {
                card.className = 'step-card res-outer';
            }
        }
    }

    function resetAll() {
        seq = [];
        chosenShift = null;

        document.getElementById('btn-in').disabled = false;
        document.getElementById('btn-out').disabled = false;

        updateOrigDisplay();

        const nums = [2, 3, 4];
        nums.forEach(n => {
            document.getElementById(`s-${n}`).classList.remove('active');
        });

        for (let i = 1; i <= 4; i++) {
            document.getElementById(`num-${i}`).innerText = '-';
            document.getElementById(`val-${i}`).innerText = '-';
            document.getElementById(`card-${i}`).className = 'step-card';
        }
    }
</script>

</body>
</html>
