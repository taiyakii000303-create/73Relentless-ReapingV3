<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 7.3 連なる青き魂 轉盤計算器</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent-color: #1e293b;
            --text-color: #f1f5f9;
            --color-inner: #38bdf8;
            --color-outer: #f59e0b;
            --bg-inner: #0c4a6e;
            --bg-outer: #78350f;
            --btn-active: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #00fff0;
            text-shadow: 0 0 10px rgba(0,255,240,0.2);
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: bold;
            border-left: 4px solid #00fff0;
            padding-left: 8px;
            color: #94a3b8;
        }

        /* 頂部依序輸入的狀態顯示 */
        .input-monitor {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .monitor-slot {
            background: #0f172a;
            padding: 8px 0;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .monitor-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .monitor-val {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* 按鈕群組 */
        .btn-group-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-group-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: 2px solid #334155;
            padding: 14px 8px;
            font-size: 1.05rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-inner {
            border-color: var(--color-inner);
            color: var(--color-inner);
            background: rgba(56, 189, 248, 0.05);
        }
        .btn-inner:hover { background: rgba(56, 189, 248, 0.15); }

        .btn-outer {
            border-color: var(--color-outer);
            color: var(--color-outer);
            background: rgba(245, 158, 11, 0.05);
        }
        .btn-outer:hover { background: rgba(245, 158, 11, 0.15); }

        .reset-btn {
            grid-column: span 2;
            background-color: #1e1b4b;
            border-color: #4338ca;
            color: #e0e7ff;
            padding: 10px;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .reset-btn:hover { background-color: #312e81; }

        /* 轉盤按鈕樣式：突顯第一個大字 */
        .shift-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 5px;
        }
        .shift-btn .big-num {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 4px;
        }
        .shift-btn .sub-seq {
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }
        .shift-btn.active {
            background-color: #2563eb;
            border-color: #60a5fa;
            color: white;
        }
        .shift-btn.active .sub-seq {
            color: #bfdbfe;
        }

        /* 最終結果顯示 */
        .result-box {
            background: #090d16;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            border: 2px solid #1e293b;
        }

        .result-title {
            text-align: center;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 14px;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
        }

        .step-card {
            background: #1e293b;
            padding: 12px 4px;
            border-radius: 10px;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }

        /* 突顯第一個數字(特大) */
        .step-num-big {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 4px;
            color: #94a3b8;
            line-height: 1;
        }

        .step-val {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 4px 0;
            border-radius: 6px;
            background: #151f32;
        }

        /* 啟動後的特殊變色 */
        .step-card.active-inner {
            border-color: var(--color-inner);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }
        .step-card.active-inner .step-num-big { color: var(--color-inner); }
        .step-card.active-inner .step-val { color: white; background: var(--bg-inner); }

        .step-card.active-outer {
            border-color: var(--color-outer);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
        }
        .step-card.active-outer .step-num-big { color: var(--color-outer); }
        .step-card.active-outer .step-val { color: white; background: var(--bg-outer); }
    </style>
</head>
<body>

<div class="container">
    <h1>連なる青き魂 轉盤計算器</h1>

    <!-- 步驟 1：依序輸入 內 / 外 -->
    <div class="section">
        <div class="section-title">1. 請依序點擊第一輪預兆安地 (滿4個)</div>
        <div class="input-monitor">
            <div class="monitor-slot"><div class="monitor-label">第1招</div><div class="monitor-val" id="mon-1">-</div></div>
            <div class="monitor-slot"><div class="monitor-label">第2招</div><div class="monitor-val" id="mon-2">-</div></div>
            <div class="monitor-slot"><div class="monitor-label">第3招</div><div class="monitor-val" id="mon-3">-</div></div>
            <div class="monitor-slot"><div class="monitor-label">第4招</div><div class="monitor-val" id="mon-4">-</div></div>
        </div>
        <div class="btn-group-2">
            <button class="btn-inner" onclick="inputMech('內')">內 (月環/兩側)</button>
            <button class="btn-outer" onclick="inputMech('外')">外 (直線/腳下)</button>
            <button class="reset-btn" onclick="resetAll()">重製清除</button>
        </div>
    </div>

    <!-- 步驟 2：選擇被打亂後的規格 (突顯第一個特大數字) -->
    <div class="section">
        <div class="section-title">2. 魂の輪轉：看第一個數字是幾號？</div>
        <div class="btn-group-3">
            <button class="shift-btn" id="s-btn-2" onclick="setShift(2)">
                <span class="big-num">2</span>
                <span class="sub-seq">3 4 1</span>
            </button>
            <button class="shift-btn" id="s-btn-3" onclick="setShift(3)">
                <span class="big-num">3</span>
                <span class="sub-seq">4 1 2</span>
            </button>
            <button class="shift-btn" id="s-btn-4" onclick="setShift(4)">
                <span class="big-num">4</span>
                <span class="sub-seq">1 2 3</span>
            </button>
        </div>
    </div>

    <!-- 最終排序輸出：突顯原本的序號(特大) -->
    <div class="result-box">
        <div class="result-title">⚡ 最終迴避順序 ⚡</div>
        <div class="steps">
            <div class="step-card" id="card-1">
                <div class="step-num-big" id="num-1">-</div>
                <div class="step-val" id="val-1">-</div>
            </div>
            <div class="step-card" id="card-2">
                <div class="step-num-big" id="num-2">-</div>
                <div class="step-val" id="val-2">-</div>
            </div>
            <div class="step-card" id="card-3">
                <div class="step-num-big" id="num-3">-</div>
                <div class="step-val" id="val-3">-</div>
            </div>
            <div class="step-card" id="card-4">
                <div class="step-num-big" id="num-4">-</div>
                <div class="step-val" id="val-4">-</div>
            </div>
        </div>
    </div>
</div>

<script>
    let seq = [];      // 玩家輸入的原始順序，例如 ['內', '外', '內', '內']
    let startNum = 0;  // 輪轉起點數字 (2, 3, 或 4)

    // 依序輸入 內 或 外
    function inputMech(type) {
        if (seq.length >= 4) return;
        
        seq.push(type);
        const idx = seq.length;
        
        // 更新上方狀態欄
        const mon = document.getElementById(`mon-${idx}`);
        mon.innerText = type;
        mon.style.color = type === '內' ? 'var(--color-inner)' : 'var(--color-outer)';
        mon.style.borderColor = type === '內' ? 'var(--color-inner)' : 'var(--color-outer)';
        
        calc();
    }

    // 設定輪轉起點數字
    function setShift(num) {
        startNum = num;
        
        // 切換按鈕高亮
        [2, 3, 4].forEach(n => {
            const btn = document.getElementById(`s-btn-${n}`);
            if (n === num) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        calc();
    }

    // 計算並重新排序
    function calc() {
        // 必須點滿 4 個機制，且選好轉盤規格才計算
        if (seq.length < 4 || startNum === 0) return;

        // 根據選擇的起始數字生成對應的 4 步原始號碼序列
        // 例如：選 2 ➔ [2, 3, 4, 1]； 選 3 ➔ [3, 4, 1, 2]
        let order = [];
        for (let i = 0; i < 4; i++) {
            let current = startNum + i;
            if (current > 4) current -= 4;
            order.push(current);
        }

        // 將對應原本號碼的安地撈出來，渲染至對應卡片上
        for (let i = 0; i < 4; i++) {
            const origId = order[i];              // 原本是第幾招 (1~4)
            const safeAction = seq[origId - 1];   // 該招原本的安地 ('內' 或 '外')
            
            const card = document.getElementById(`card-${i+1}`);
            const numText = document.getElementById(`num-${i+1}`);
            const valText = document.getElementById(`val-${i+1}`);
            
            // 填入特大號數字與安地文字
            numText.innerText = origId;
            valText.innerText = safeAction;
            
            // 套用高亮顏色
            card.className = 'step-card ' + (safeAction === '內' ? 'active-inner' : 'active-outer');
        }
    }

    // 一鍵重製清除
    function resetAll() {
        seq = [];
        startNum = 0;
        
        // 還原上方狀態
        for (let i = 1; i <= 4; i++) {
            const mon = document.getElementById(`mon-${i}`);
            mon.innerText = '-';
            mon.style.color = '#64748b';
            mon.style.borderColor = '#334155';
        }
        
        // 還原轉盤按鈕
        [2, 3, 4].forEach(n => {
            document.getElementById(`s-btn-${n}`).classList.remove('active');
        });
        
        // 還原結果面板
        for (let i = 1; i <= 4; i++) {
            document.getElementById(`num-${i}`).innerText = '-';
            document.getElementById(`val-${i}`).innerText = '-';
            document.getElementById(`card-${i}`).className = 'step-card';
        }
    }
</script>
</body>
</html>
